    <script type="application/ld+json">

          "@type": "Question",
          "name": "What makes Edukate UIL different from WhatsApp groups?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Edukate UIL provides a centralized, deduplicated repository for your exact department and level, complete with built-in AI study tools. No more scrolling through endless chat messages to find files."

        },
        {
          "@type": "Question",
          "name": "Who is Buhari?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Buhari is your inbuilt AI Study Assistant. It can read your lecture notes and automatically generate summaries, flashcards, and quizzes to help you learn faster and test your knowledge."
          }
        },
        {
          "@type": "Question",
          "name": "How does the duplicate-prevention system work?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "When a student uploads a new material, our backend hashes the file. If that exact file exists in the faculty's database, the upload is rejected. If it's new, it goes to moderators for approval."
          }
        },
        {
          "@type": "Question",
          "name": "Is Edukate UIL free to use?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes, this platform is built entirely for the Faculty of Physical Sciences students to ensure everyone has access to quality educational tools."
          }
        }
      ]
    }
